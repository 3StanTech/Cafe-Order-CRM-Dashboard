# Quality gate: lint, unit tests, production build, gzipped initial-route
# bundle budget, and demo-mode Playwright smoke.
# No repository secrets required. CI never applies database migrations.
name: quality

on:
  pull_request:
  push:
    branches:
      - main
      - simplify-cafe-order-intake

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Server typecheck
        run: npm run check:server

      - name: Bundle budget
        run: npm run check:bundle

      - name: E2E smoke (demo mode)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
